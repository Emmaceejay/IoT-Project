name: Firmware Build

# Produces the artifacts the web flasher consumes: one universal binary per
# chip family, plus an ESP Web Tools manifest describing where each part goes.
#
# The eleven per-SKU projects are still built as a regression check that the
# Kconfig path works, but they are not what gets published — the universal
# image configures itself into any SKU at provisioning time.

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "dsgv_firmware/**"
      - ".github/workflows/firmware-build.yml"
  pull_request:
    paths:
      - "dsgv_firmware/**"
      - ".github/workflows/firmware-build.yml"
  workflow_dispatch:

env:
  # Single source of truth for the toolchain. idf_component.yml declares a
  # ">=5.2" floor, which spans the 5.x/6.x boundary and is not reproducible;
  # this pin is what actually ships.
  IDF_VERSION: v5.5
  FW_VERSION: 1.0.0

jobs:
  # ── Catalogue ──────────────────────────────────────────────────────────────
  # Fast, no toolchain needed, so it gates the expensive jobs. The catalogue is
  # designed to be extended by editing JSON with no rebuild — which is only
  # safe if something checks the JSON, since a bad entry does not fail to
  # compile, it reaches a user's board and misconfigures it.
  catalog:
    name: catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # chips.json is generated from the firmware's own pin masks. If someone
      # edits dsgv_pin_rules.c without regenerating, the UI would offer pins
      # the firmware rejects — or worse, pins it should reject.
      - name: Chip tables match firmware pin rules
        run: |
          python3 dsgv_firmware/tools/gen_chip_tables.py \
            --out catalog/chips.json --check

      - name: Validate device catalogue
        run: python3 dsgv_firmware/tools/validate_catalog.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The flasher's pure logic — frame encoding and pin validation — is
      # testable without a browser or a board. The Web Serial and esptool
      # layers are not, and are verified by hand against hardware.
      - name: Web flasher unit tests
        run: node --test webflasher/test/frame.test.mjs webflasher/test/config.test.mjs

      # The JS framing has to agree with the Python tool byte for byte, since
      # both talk to the same firmware parser.
      - name: Cross-check JS and Python framing
        run: python3 webflasher/test/cross_check_frames.py

  # ── Per-SKU regression ─────────────────────────────────────────────────────
  # One target is enough here: these differ only in Kconfig string values, so
  # this catches a malformed capabilities array or an out-of-range relay count.
  skus:
    name: ${{ matrix.sku }} @ esp32c3
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sku:
          - 1gang_switch
          - 2gang_switch
          - 3gang_switch
          - 4gang_switch
          - dimmer
          - colour_temp
          - rgb_light
          - temp_sensor
          - motion_sensor
          - contact_sensor
          - thermostat
    steps:
      - uses: actions/checkout@v4

      - name: Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: esp32c3
          path: dsgv_firmware/devices/${{ matrix.sku }}

      # ninja interleaves output from parallel compile jobs, so the tail of the
      # console log often belongs to a different file than the one that failed.
      # These files hold only diagnostics, in order.
      - name: Dump build error log
        if: failure()
        run: |
          for f in dsgv_firmware/devices/${{ matrix.sku }}/build/log/idf_py_stderr_output_*; do
            [ -e "$f" ] || continue
            echo "───── $f ─────"
            cat "$f"
          done

  # ── Universal image, one per chip ──────────────────────────────────────────
  universal:
    name: universal @ ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [esp32, esp32c3, esp32s3, esp32c6]
    steps:
      - uses: actions/checkout@v4

      - name: Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: ${{ matrix.target }}
          path: dsgv_firmware/devices/universal

      - name: Dump build error log
        if: failure()
        run: |
          for f in dsgv_firmware/devices/universal/build/log/idf_py_stderr_output_*; do
            [ -e "$f" ] || continue
            echo "───── $f ─────"
            cat "$f"
          done

      # Flatten into the layout the manifest references. Offsets come from the
      # build's own flash_args, never hardcoded: the bootloader is at 0x1000 on
      # ESP32 but 0x0 on C3/C6/S3, and a wrong offset flashes cleanly and then
      # fails to boot — painful to diagnose from a browser.
      - name: Stage artifacts and generate manifest entry
        run: |
          set -euo pipefail
          BUILD=dsgv_firmware/devices/universal/build
          OUT=dist/${{ matrix.target }}
          mkdir -p "$OUT"

          echo "── flash_args (${{ matrix.target }}) ──"
          cat "$BUILD/flash_args"

          cp "$BUILD/bootloader/bootloader.bin"             "$OUT/"
          cp "$BUILD/partition_table/partition-table.bin"   "$OUT/"
          cp "$BUILD/ota_data_initial.bin"                  "$OUT/"
          cp "$BUILD/dsgv_universal.bin"                    "$OUT/"

          python3 dsgv_firmware/tools/gen_manifest.py \
            --build-dir "$BUILD" \
            --chip ${{ matrix.target }} \
            --out "$OUT/build-${{ matrix.target }}.json"

          echo "── staged ──"
          ls -l "$OUT"

      - name: Check app fits its OTA slot
        run: |
          set -euo pipefail
          # partitions_4mb.csv gives each OTA slot 0x1D0000.
          LIMIT=$((0x1D0000))
          SIZE=$(stat -c%s dist/${{ matrix.target }}/dsgv_universal.bin)
          PCT=$((SIZE * 100 / LIMIT))
          echo "app: $SIZE B of $LIMIT B (${PCT}%)"
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::app exceeds the OTA slot by $((SIZE - LIMIT)) bytes"
            exit 1
          fi
          if [ "$PCT" -gt 90 ]; then
            echo "::warning::app is at ${PCT}% of the OTA slot"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: universal-${{ matrix.target }}
          if-no-files-found: error
          path: dist/${{ matrix.target }}

  # ── Combined manifest ──────────────────────────────────────────────────────
  manifest:
    name: manifest
    needs: universal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: universal-*
          path: dist

      - name: Merge per-chip entries
        run: |
          set -euo pipefail
          find dist -name 'build-*.json' | sort

          python3 dsgv_firmware/tools/gen_manifest.py \
            --merge $(find dist -name 'build-*.json' | sort) \
            --name "DSGV Universal Firmware" \
            --version "${FW_VERSION}" \
            --out manifest.json

          echo "── manifest.json ──"
          cat manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: manifest
          if-no-files-found: error
          path: manifest.json
