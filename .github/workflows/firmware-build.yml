name: Firmware Build

# Produces the artifacts the web flasher consumes: one universal binary per
# chip family, plus an ESP Web Tools manifest describing where each part goes.
#
# The eleven per-SKU projects are still built as a regression check that the
# Kconfig path works, but they are not what gets published — the universal
# image configures itself into any SKU at provisioning time.

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "dsgv_firmware/**"
      - "dsgv_firmware_esp8266/**"
      - "catalog/**"
      - "webflasher/**"
      - ".github/workflows/firmware-build.yml"
  pull_request:
    paths:
      - "dsgv_firmware/**"
      - "dsgv_firmware_esp8266/**"
      - "catalog/**"
      - "webflasher/**"
      - ".github/workflows/firmware-build.yml"
  workflow_dispatch:

env:
  # Single source of truth for the toolchain. idf_component.yml declares a
  # ">=5.2" floor, which spans the 5.x/6.x boundary and is not reproducible;
  # this pin is what actually ships.
  IDF_VERSION: v5.5
  FW_VERSION: 1.0.0

jobs:
  # ── Catalogue ──────────────────────────────────────────────────────────────
  # Fast, no toolchain needed, so it gates the expensive jobs. The catalogue is
  # designed to be extended by editing JSON with no rebuild — which is only
  # safe if something checks the JSON, since a bad entry does not fail to
  # compile, it reaches a user's board and misconfigures it.
  catalog:
    name: catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # chips.json is generated from the firmware's own pin masks. If someone
      # edits dsgv_pin_rules.c without regenerating, the UI would offer pins
      # the firmware rejects — or worse, pins it should reject.
      - name: Chip tables match firmware pin rules
        run: |
          python3 dsgv_firmware/tools/gen_chip_tables.py \
            --out catalog/chips.json --check

      - name: Validate device catalogue
        run: python3 dsgv_firmware/tools/validate_catalog.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The flasher's pure logic — frame encoding and pin validation — is
      # testable without a browser or a board. The Web Serial and esptool
      # layers are not, and are verified by hand against hardware.
      - name: Web flasher unit tests
        run: node --test webflasher/test/frame.test.mjs webflasher/test/config.test.mjs

      # The JS framing has to agree with the Python tool byte for byte, since
      # both talk to the same firmware parser.
      - name: Cross-check JS and Python framing
        run: python3 webflasher/test/cross_check_frames.py

  # ── Per-SKU regression ─────────────────────────────────────────────────────
  # One target is enough here: these differ only in Kconfig string values, so
  # this catches a malformed capabilities array or an out-of-range relay count.
  skus:
    name: ${{ matrix.sku }} @ esp32c3
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sku:
          - 1gang_switch
          - 2gang_switch
          - 3gang_switch
          - 4gang_switch
          - dimmer
          - colour_temp
          - rgb_light
          - temp_sensor
          - motion_sensor
          - contact_sensor
          - thermostat
    steps:
      - uses: actions/checkout@v4

      - name: Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: esp32c3
          path: dsgv_firmware/devices/${{ matrix.sku }}

      # ninja interleaves output from parallel compile jobs, so the tail of the
      # console log often belongs to a different file than the one that failed.
      # These files hold only diagnostics, in order.
      - name: Dump build error log
        if: failure()
        run: |
          for f in dsgv_firmware/devices/${{ matrix.sku }}/build/log/idf_py_stderr_output_*; do
            [ -e "$f" ] || continue
            echo "───── $f ─────"
            cat "$f"
          done

  # ── Universal image, one per chip ──────────────────────────────────────────
  universal:
    name: universal @ ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [esp32, esp32c3, esp32s3, esp32c6]
    steps:
      - uses: actions/checkout@v4

      - name: Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: ${{ matrix.target }}
          path: dsgv_firmware/devices/universal

      - name: Dump build error log
        if: failure()
        run: |
          for f in dsgv_firmware/devices/universal/build/log/idf_py_stderr_output_*; do
            [ -e "$f" ] || continue
            echo "───── $f ─────"
            cat "$f"
          done

      # Flatten into the layout the manifest references. Offsets come from the
      # build's own flash_args, never hardcoded: the bootloader is at 0x1000 on
      # ESP32 but 0x0 on C3/C6/S3, and a wrong offset flashes cleanly and then
      # fails to boot — painful to diagnose from a browser.
      - name: Stage artifacts and generate manifest entry
        run: |
          set -euo pipefail
          BUILD=dsgv_firmware/devices/universal/build
          OUT=dist/${{ matrix.target }}
          mkdir -p "$OUT"

          echo "── flash_args (${{ matrix.target }}) ──"
          cat "$BUILD/flash_args"

          cp "$BUILD/bootloader/bootloader.bin"             "$OUT/"
          cp "$BUILD/partition_table/partition-table.bin"   "$OUT/"
          cp "$BUILD/ota_data_initial.bin"                  "$OUT/"
          cp "$BUILD/dsgv_universal.bin"                    "$OUT/"

          python3 dsgv_firmware/tools/gen_manifest.py \
            --build-dir "$BUILD" \
            --chip ${{ matrix.target }} \
            --out "$OUT/build-${{ matrix.target }}.json"

          echo "── staged ──"
          ls -l "$OUT"

      - name: Check app fits its OTA slot
        run: |
          set -euo pipefail
          # partitions_4mb.csv gives each OTA slot 0x1D0000.
          LIMIT=$((0x1D0000))
          SIZE=$(stat -c%s dist/${{ matrix.target }}/dsgv_universal.bin)
          PCT=$((SIZE * 100 / LIMIT))
          echo "app: $SIZE B of $LIMIT B (${PCT}%)"
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::app exceeds the OTA slot by $((SIZE - LIMIT)) bytes"
            exit 1
          fi
          if [ "$PCT" -gt 90 ]; then
            echo "::warning::app is at ${PCT}% of the OTA slot"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: universal-${{ matrix.target }}
          if-no-files-found: error
          path: dist/${{ matrix.target }}

  # ── ESP8266 ────────────────────────────────────────────────────────────────
  # A different silicon generation and a different SDK: ESP8266_RTOS_SDK v3.4
  # is a frozen fork tracking ESP-IDF v3.3 APIs, with its own xtensa-lx106
  # toolchain. There is no official CI action, so both are installed by hand.
  #
  # This exists before any device code is ported, on purpose. Writing the
  # firmware first and discovering later that it never compiled is precisely
  # what produced the 17 defects Phase 0 had to clear.
  esp8266:
    name: esp8266
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The SDK's tooling predates modern Python packaging; its pinned
      # dependencies do not all build on 3.12.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache toolchain and SDK
        id: cache-8266
        uses: actions/cache@v4
        with:
          path: |
            ~/esp8266/xtensa-lx106-elf
            ~/esp8266/ESP8266_RTOS_SDK
          key: esp8266-sdk-v3.4-gcc8.4.0-v1

      - name: Install toolchain and SDK
        if: steps.cache-8266.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/esp8266 && cd ~/esp8266

          echo "── toolchain ──"
          curl -fsSL -o tc.tar.gz \
            https://dl.espressif.com/dl/xtensa-lx106-elf-gcc8_4_0-esp-2020r3-linux-amd64.tar.gz
          tar -xzf tc.tar.gz && rm tc.tar.gz
          ./xtensa-lx106-elf/bin/xtensa-lx106-elf-gcc --version | head -1

          echo "── SDK ──"
          # Not --recursive. The coap component carries a nested tinydtls
          # submodule pointing at Eclipse's old Gerrit URL, which now redirects
          # to GitHub; git refuses a redirect that changes the URL base, so a
          # recursive clone of v3.4 cannot succeed. Bitrot in a frozen SDK.
          # Only the submodules this firmware actually needs are initialised.
          git clone --depth 1 -b v3.4 \
            https://github.com/espressif/ESP8266_RTOS_SDK.git
          cd ESP8266_RTOS_SDK
          git submodule update --init --depth 1 \
            components/json/cJSON \
            components/lwip/lwip \
            components/mbedtls/mbedtls \
            components/mqtt/esp-mqtt

      - name: Install SDK Python requirements
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel
          python -m pip install -r ~/esp8266/ESP8266_RTOS_SDK/requirements.txt

      - name: Build
        run: |
          set -euo pipefail
          export IDF_PATH=~/esp8266/ESP8266_RTOS_SDK
          export PATH=~/esp8266/xtensa-lx106-elf/bin:$PATH

          cd dsgv_firmware_esp8266
          make defconfig
          make -j"$(nproc)"

          echo "── build output ──"
          ls -l build/*.bin

      - name: Report image size against the OTA slot
        run: |
          set -euo pipefail
          cd dsgv_firmware_esp8266
          APP=$(ls build/dsgv_universal_8266.bin)
          SIZE=$(stat -c%s "$APP")
          echo "app: $SIZE bytes"
          # Recorded rather than gated: the slot size depends on the partition
          # layout, which changes once the real device code lands.
          echo "::notice::ESP8266 app image is $SIZE bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: esp8266-proof
          if-no-files-found: error
          path: |
            dsgv_firmware_esp8266/build/*.bin
            dsgv_firmware_esp8266/build/*.map

  # ── Combined manifest ──────────────────────────────────────────────────────
  manifest:
    name: manifest
    needs: universal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: universal-*
          path: dist

      - name: Merge per-chip entries
        run: |
          set -euo pipefail
          find dist -name 'build-*.json' | sort

          python3 dsgv_firmware/tools/gen_manifest.py \
            --merge $(find dist -name 'build-*.json' | sort) \
            --name "DSGV Universal Firmware" \
            --version "${FW_VERSION}" \
            --out manifest.json

          echo "── manifest.json ──"
          cat manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: manifest
          if-no-files-found: error
          path: manifest.json
